<app-header></app-header>

@if(recipes$ | async; as recipes) {
    @if(recipes.length == 0) {
            <mat-icon class="big-icon">sentiment_very_dissatisfied</mat-icon>
            <p>No recipes found.</p>
        
    } @else {
        @if(store.loading()) {
            <mat-spinner matSuffix diameter="20"></mat-spinner>
        }
        <search-recipe></search-recipe>
        <p class="text-left"><strong>{{recipes.length}}</strong> recipes found.</p>
        <div class="recipe-list">
            @for (recipe of (recipes$ | async); track recipe.id) {
                <recipe-card class="recipe-card" [recipe]="recipe"></recipe-card>
            }
        </div>       
    }
}
