<h2>Favourites</h2>
@for(recipe of store.favouriteRecipes(); track recipe.id) {
    <mat-card>
        <strong>{{recipe.name}}</strong>
        <p matLine>Category: {{recipe.category}}</p>
        <recipe-thumb [recipe]="recipe"></recipe-thumb>
        <button mat-button color="info" (click)="onRemoveFavourite(recipe)">Remove from favourites</button>
        <button mat-button color="info" [routerLink]="['/recipe', recipe.id]">Details</button>
    </mat-card>
}
